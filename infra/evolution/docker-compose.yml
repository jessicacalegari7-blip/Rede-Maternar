services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [evolution_postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"], interval: 10s, timeout: 5s, retries: 10}
    networks: [evolution]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [evolution_redis:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10}
    networks: [evolution]
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [evolution_instances:/evolution/instances]
    networks: [evolution]
volumes: {evolution_postgres: {}, evolution_redis: {}, evolution_instances: {}}
networks: {evolution: {driver: bridge}}
